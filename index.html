<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Punto Vital | VITA </title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #eaf7ff, #ffffff);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 500px;
      background: white;
      border-radius: 24px;
      box-shadow: 0 15px 45px rgba(0, 80, 140, 0.15);
      overflow: hidden;
    }

    .header {
      background: #087fc3;
      color: white;
      text-align: center;
      padding: 22px;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      margin: 6px 0 0;
      opacity: 0.9;
    }

    .avatar-area {
      text-align: center;
      padding: 25px 20px 15px;
    }

   .avatar {
    width: 220px;
    height: 220px;
    margin: auto;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #7fe8ff 0%, #2d8cff 32%, #0b4fc4 62%, #06245f 100%);
    background-size: cover;
    background-position: center 25%;
    background-repeat: no-repeat;
    box-shadow: 0 8px 25px rgba(8, 127, 195, 0.25);
    overflow: hidden;
} 
    

    .avatar-area h2 {
      margin: 14px 0 5px;
      color: #075b8d;
    }

    .estado {
      color: #5f6f78;
      font-size: 14px;
    }

    #chat {
      height: 280px;
      overflow-y: auto;
      padding: 15px 20px;
      background: #f6fbfe;
    }

    .mensaje {
      margin: 10px 0;
      padding: 12px 15px;
      border-radius: 16px;
      max-width: 85%;
      line-height: 1.4;
    }

    .usuario {
      background: #087fc3;
      color: white;
      margin-left: auto;
    }

    .asistente {
      background: white;
      color: #263238;
      border: 1px solid #dcecf5;
    }

    .controles {
      padding: 15px;
      display: flex;
      gap: 8px;
    }

    #texto {
      flex: 1;
      padding: 13px;
      border-radius: 14px;
      border: 1px solid #cbdce5;
      outline: none;
      font-size: 16px;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 14px;
      font-size: 18px;
    }

    #enviar {
      background: #087fc3;
      color: white;
      padding: 0 18px;
    }

    #microfono {
      width: 52px;
      background: #e8f6fd;
      font-size: 23px;
    }

    .pie {
      text-align: center;
      color: #7b8b94;
      font-size: 12px;
      padding: 0 15px 15px;
    }/* ===== ORBE VITA ===== */

.avatar.vita-orbe {
  position: relative;
  overflow: hidden;
  border-radius: 50%;
  background: radial-gradient(
    circle at 35% 30%,
    #b9f4ff 0%,
    #62dfff 18%,
    #2d8cff 42%,
    #0b4fc4 68%,
    #06245f 100%
  );
  box-shadow:
    0 0 18px rgba(80, 205, 255, 0.75),
    0 0 42px rgba(45, 140, 255, 0.55),
    0 0 70px rgba(11, 79, 196, 0.35);
  animation: vitaRespira 3s ease-in-out infinite;
}

.avatar.vita-orbe::before {
  content: "";
  position: absolute;
  inset: 10%;
  border-radius: 50%;
  background: radial-gradient(
    circle,
    rgba(255,255,255,0.85) 0%,
    rgba(126,232,255,0.45) 28%,
    rgba(45,140,255,0.08) 65%,
    transparent 75%
  );
  filter: blur(6px);
}

.avatar.vita-orbe::after {
  content: "";
  position: absolute;
  inset: 5%;
  border-radius: 50%;
  border: 1px solid rgba(190, 240, 255, 0.65);
  box-shadow:
    inset 0 0 18px rgba(255,255,255,0.35),
    0 0 18px rgba(126,232,255,0.35);
}

.vita-orbe .cara {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: transparent;
}

.vita-orbe .boca {
  position: absolute;
  inset: -8%;
  width: auto;
  height: auto;
  border-radius: 50%;
  background: transparent;
  box-shadow: 0 0 0 rgba(126,232,255,0);
}

.vita-orbe .boca.hablando {
  animation: vitaHabla 0.55s ease-in-out infinite alternate;
}

@keyframes vitaRespira {
  0%, 100% {
    transform: scale(1);
    filter: brightness(1);
  }

  50% {
    transform: scale(1.035);
    filter: brightness(1.12);
  }
}

@keyframes vitaHabla {
  from {
    transform: scale(0.92);
    box-shadow:
      0 0 12px rgba(126,232,255,0.4),
      0 0 25px rgba(45,140,255,0.3);
  }

  to {
    transform: scale(1.08);
    box-shadow:
      0 0 28px rgba(190,245,255,0.95),
      0 0 55px rgba(45,140,255,0.75);
  }
}/* ===== AJUSTE FINO VITA ===== */

.avatar.vita-orbe {
  width: min(210px, 72vw);
  height: min(210px, 72vw);
  margin: 8px auto 12px;

  background:
    radial-gradient(
      circle at 38% 28%,
      rgba(210, 250, 255, 0.95) 0%,
      rgba(92, 220, 255, 0.88) 14%,
      rgba(36, 139, 255, 0.95) 38%,
      rgba(9, 75, 190, 0.98) 68%,
      rgba(4, 31, 91, 1) 100%
    );

  box-shadow:
    0 0 12px rgba(105, 225, 255, 0.65),
    0 0 28px rgba(45, 140, 255, 0.42),
    0 0 48px rgba(11, 79, 196, 0.22);
}

.avatar.vita-orbe::before {
  inset: 16%;
  background:
    radial-gradient(
      circle at 42% 35%,
      rgba(255, 255, 255, 0.85) 0%,
      rgba(160, 240, 255, 0.42) 22%,
      rgba(60, 170, 255, 0.10) 58%,
      transparent 72%
    );
  filter: blur(9px);
}

.avatar.vita-orbe::after {
  inset: 6%;
  border: 1px solid rgba(190, 242, 255, 0.45);
  box-shadow:
    inset 0 0 20px rgba(255, 255, 255, 0.18),
    0 0 12px rgba(120, 220, 255, 0.22);
}

.avatar-area h2 {
  margin-top: 4px;
  margin-bottom: 4px;
  font-size: 24px;
  letter-spacing: 1px;
}

.avatar-area .estado {
  margin-top: 0;
  font-size: 14px;
  opacity: 0.78;
}
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <h1>PUNTO VITAL</h1>
    <p>Salud más cerca de ti</p>
  </div>

  <div class="avatar-area">
  <div class="avatar vita-orbe">
    <div class="cara" id="cara">
    
      <div class="boca" id="boca"></div>
    </div>
  </div>

  <h2>VITA</h2>

  <div class="estado" id="estado">
    Lista para ayudarte
  </div>
</div>

  <div id="chat">
    <div class="mensaje asistente">
      ¡Hola! Bienvenido a Punto Vital. ¿En qué puedo ayudarte?
    </div>
  </div>

  <div class="controles">
    <button id="microfono" title="Hablar">🎙️</button>

    <input
      id="texto"
      type="text"
      placeholder="Escribe o habla..."
      autocomplete="off"
    >

    <button id="enviar">➤</button>
  </div>

  <div class="pie">
    Asistente virtual de Punto Vital
  </div>

</div>

<script>
  const API = "https://punto-vital-recepcionista.onrender.com/chat";

  const chat = document.getElementById("chat");
  const texto = document.getElementById("texto");
  const enviar = document.getElementById("enviar");
  const microfono = document.getElementById("microfono");
  const estado = document.getElementById("estado");

  function agregarMensaje(mensaje, tipo) {
    const div = document.createElement("div");
    div.className = "mensaje " + tipo;
    div.textContent = mensaje;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function hablar(mensaje) {
  if (!("speechSynthesis" in window)) return;

  speechSynthesis.cancel();

  const voz = new SpeechSynthesisUtterance(mensaje);
  voz.lang = "es-MX";
  voz.rate = 1;
  voz.pitch = 1;

  const boca = document.getElementById("boca");

  voz.onstart = () => {
    boca.classList.add("hablando");
  };

  voz.onend = () => {
    boca.classList.remove("hablando");
  };

  voz.onerror = () => {
    boca.classList.remove("hablando");
  };

  speechSynthesis.speak(voz);
}

  async function mandarMensaje(mensaje) {
    mensaje = mensaje.trim();

    if (!mensaje) return;

    agregarMensaje(mensaje, "usuario");
    texto.value = "";

    estado.textContent = "Pensando...";

    try {
      const respuesta = await fetch(API, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          mensaje: mensaje
        })
      });

      if (!respuesta.ok) {
        throw new Error("Error HTTP " + respuesta.status);
      }

      const datos = await respuesta.json();

      const respuestaIA =
        datos.respuesta ||
        datos.output_text ||
        datos.mensaje ||
        "Recibí tu mensaje, pero no pude mostrar la respuesta.";

      agregarMensaje(respuestaIA, "asistente");
      hablar(respuestaIA);

      estado.textContent = "Lista para ayudarte";

    } catch (error) {
      console.error(error);

      agregarMensaje(
        "No pude comunicarme con el servidor. Vamos a revisar la conexión.",
        "asistente"
      );

      estado.textContent = "Error de conexión";
    }
  }

  enviar.addEventListener("click", () => {
    mandarMensaje(texto.value);
  });

  texto.addEventListener("keydown", (evento) => {
    if (evento.key === "Enter") {
      mandarMensaje(texto.value);
    }
  });

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (SpeechRecognition) {

    const reconocimiento = new SpeechRecognition();

    reconocimiento.lang = "es-MX";
    reconocimiento.continuous = false;
    reconocimiento.interimResults = false;

    microfono.addEventListener("click", () => {
      estado.textContent = "Escuchando...";
      reconocimiento.start();
    });

    reconocimiento.onresult = (evento) => {
      const mensaje =
        evento.results[0][0].transcript;

      texto.value = mensaje;

      estado.textContent = "Mensaje escuchado";

      mandarMensaje(mensaje);
    };

    reconocimiento.onerror = () => {
      estado.textContent =
        "No pude escuchar. Inténtalo otra vez.";
    };

    reconocimiento.onend = () => {
      if (estado.textContent === "Escuchando...") {
        estado.textContent = "Lista para ayudarte";
      }
    };

  } else {
    microfono.disabled = true;
    microfono.title =
      "El reconocimiento de voz no está disponible en este navegador";
  }
</script>

</body>
</html>
