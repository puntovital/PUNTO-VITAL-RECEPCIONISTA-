<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Punto Vital | Recepcionista Virtual</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #eaf7ff, #ffffff);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 500px;
      background: white;
      border-radius: 24px;
      box-shadow: 0 15px 45px rgba(0, 80, 140, 0.15);
      overflow: hidden;
    }

    .header {
      background: #087fc3;
      color: white;
      text-align: center;
      padding: 22px;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      margin: 6px 0 0;
      opacity: 0.9;
    }

    .avatar-area {
      text-align: center;
      padding: 25px 20px 15px;
    }

    .avatar {
      width: 120px;
      height: 120px;
      margin: auto;
      border-radius: 50%;
      background: linear-gradient(135deg, #087fc3, #5fc8f5);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 58px;
      box-shadow: 0 8px 25px rgba(8, 127, 195, 0.25);
    }

    .avatar-area h2 {
      margin: 14px 0 5px;
      color: #075b8d;
    }

    .estado {
      color: #5f6f78;
      font-size: 14px;
    }

    #chat {
      height: 280px;
      overflow-y: auto;
      padding: 15px 20px;
      background: #f6fbfe;
    }

    .mensaje {
      margin: 10px 0;
      padding: 12px 15px;
      border-radius: 16px;
      max-width: 85%;
      line-height: 1.4;
    }

    .usuario {
      background: #087fc3;
      color: white;
      margin-left: auto;
    }

    .asistente {
      background: white;
      color: #263238;
      border: 1px solid #dcecf5;
    }

    .controles {
      padding: 15px;
      display: flex;
      gap: 8px;
    }

    #texto {
      flex: 1;
      padding: 13px;
      border-radius: 14px;
      border: 1px solid #cbdce5;
      outline: none;
      font-size: 16px;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 14px;
      font-size: 18px;
    }

    #enviar {
      background: #087fc3;
      color: white;
      padding: 0 18px;
    }

    #microfono {
      width: 52px;
      background: #e8f6fd;
      font-size: 23px;
    }

    .pie {
      text-align: center;
      color: #7b8b94;
      font-size: 12px;
      padding: 0 15px 15px;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <h1>PUNTO VITAL</h1>
    <p>Salud más cerca de ti</p>
  </div>

  <div class="avatar-area">
    <div class="avatar">👩🏻‍⚕️</div>
    <h2>Recepcionista Virtual</h2>
    <div class="estado" id="estado">Lista para ayudarte</div>
  </div>

  <div id="chat">
    <div class="mensaje asistente">
      ¡Hola! Bienvenido a Punto Vital. ¿En qué puedo ayudarte?
    </div>
  </div>

  <div class="controles">
    <button id="microfono" title="Hablar">🎙️</button>

    <input
      id="texto"
      type="text"
      placeholder="Escribe o habla..."
      autocomplete="off"
    >

    <button id="enviar">➤</button>
  </div>

  <div class="pie">
    Asistente virtual de Punto Vital
  </div>

</div>

<script>
  const API = "https://punto-vital-recepcionista.onrender.com/chat";

  const chat = document.getElementById("chat");
  const texto = document.getElementById("texto");
  const enviar = document.getElementById("enviar");
  const microfono = document.getElementById("microfono");
  const estado = document.getElementById("estado");

  function agregarMensaje(mensaje, tipo) {
    const div = document.createElement("div");
    div.className = "mensaje " + tipo;
    div.textContent = mensaje;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function hablar(mensaje) {
    if (!("speechSynthesis" in window)) return;

    speechSynthesis.cancel();

    const voz = new SpeechSynthesisUtterance(mensaje);
    voz.lang = "es-MX";
    voz.rate = 1;
    voz.pitch = 1;

    speechSynthesis.speak(voz);
  }

  async function mandarMensaje(mensaje) {
    mensaje = mensaje.trim();

    if (!mensaje) return;

    agregarMensaje(mensaje, "usuario");
    texto.value = "";

    estado.textContent = "Pensando...";

    try {
      const respuesta = await fetch(API, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          mensaje: mensaje
        })
      });

      if (!respuesta.ok) {
        throw new Error("Error HTTP " + respuesta.status);
      }

      const datos = await respuesta.json();

      const respuestaIA =
        datos.respuesta ||
        datos.output_text ||
        datos.mensaje ||
        "Recibí tu mensaje, pero no pude mostrar la respuesta.";

      agregarMensaje(respuestaIA, "asistente");
      hablar(respuestaIA);

      estado.textContent = "Lista para ayudarte";

    } catch (error) {
      console.error(error);

      agregarMensaje(
        "No pude comunicarme con el servidor. Vamos a revisar la conexión.",
        "asistente"
      );

      estado.textContent = "Error de conexión";
    }
  }

  enviar.addEventListener("click", () => {
    mandarMensaje(texto.value);
  });

  texto.addEventListener("keydown", (evento) => {
    if (evento.key === "Enter") {
      mandarMensaje(texto.value);
    }
  });

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (SpeechRecognition) {

    const reconocimiento = new SpeechRecognition();

    reconocimiento.lang = "es-MX";
    reconocimiento.continuous = false;
    reconocimiento.interimResults = false;

    microfono.addEventListener("click", () => {
      estado.textContent = "Escuchando...";
      reconocimiento.start();
    });

    reconocimiento.onresult = (evento) => {
      const mensaje =
        evento.results[0][0].transcript;

      texto.value = mensaje;

      estado.textContent = "Mensaje escuchado";

      mandarMensaje(mensaje);
    };

    reconocimiento.onerror = () => {
      estado.textContent =
        "No pude escuchar. Inténtalo otra vez.";
    };

    reconocimiento.onend = () => {
      if (estado.textContent === "Escuchando...") {
        estado.textContent = "Lista para ayudarte";
      }
    };

  } else {
    microfono.disabled = true;
    microfono.title =
      "El reconocimiento de voz no está disponible en este navegador";
  }
</script>

</body>
</html>
